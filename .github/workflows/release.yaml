# 在 fork 仓库打 v* tag 后自动发布 Release、GHCR 镜像并更新 Homebrew tap
# 所需 Secrets：PUSH_GITHUB_TOKEN（PAT，推 tap + 登录 ghcr）、COSIGN_PASSWORD、COSIGN_KEY（可选签名）
name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # 使用当前仓库 owner，fork 后镜像推送到自己的 ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUSH_GITHUB_TOKEN }}
      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@v0.21.0
      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3
      - name: Write signing key to tmp
        # COSIGN_KEY 建议存 Base64 编码的私钥，避免 GitHub 多行 Secret 破坏换行导致 invalid pem block
        run: echo "${{ secrets.COSIGN_KEY }}" | base64 -d > /tmp/cosign.key
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --skip validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.PUSH_GITHUB_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
